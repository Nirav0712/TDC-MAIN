<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284C7" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Diagonal Grid Background for technical feel -->
  <path d="M0 100 L800 100 M0 200 L800 200 M0 300 L800 300 M0 400 L800 400 M0 500 L800 500" stroke="#CBD5E1" stroke-width="1" fill="none" opacity="0.5" />
  <path d="M100 0 L100 600 M200 0 L200 600 M300 0 L300 600 M400 0 L400 600 M500 0 L500 600 M600 0 L600 600 M700 0 L700 600" stroke="#CBD5E1" stroke-width="1" fill="none" opacity="0.5" />

  <!-- Center Shield Element -->
  <g transform="translate(400, 300)" filter="url(#glow)">
    <path d="M0 -150 L120 -100 L120 40 C120 120 60 180 0 200 C-60 180 -120 120 -120 40 L-120 -100 Z" fill="#FFFFFF" stroke="url(#primaryGrad)" stroke-width="8" />
    <!-- Checkmark inside shield -->
    <path d="M-50 20 L-10 60 L60 -40" stroke="url(#primaryGrad)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Server/Network Nodes -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="20" cy="30" r="6" fill="#10B981" />
    <rect x="40" y="25" width="40" height="10" rx="5" fill="#E2E8F0" />
    <path d="M100 30 L200 130" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" fill="none" />
  </g>

  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="20" cy="30" r="6" fill="#10B981" />
    <rect x="40" y="25" width="40" height="10" rx="5" fill="#E2E8F0" />
    <path d="M0 30 L-90 100" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" fill="none" />
  </g>

  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="20" cy="30" r="6" fill="#10B981" />
    <rect x="40" y="25" width="40" height="10" rx="5" fill="#E2E8F0" />
    <path d="M100 30 L160 -40" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" fill="none" />
  </g>

  <g transform="translate(520, 450)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="20" cy="30" r="6" fill="#10B981" />
    <rect x="40" y="25" width="40" height="10" rx="5" fill="#E2E8F0" />
    <path d="M0 30 L-50 -70" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8" fill="none" />
  </g>
</svg>
