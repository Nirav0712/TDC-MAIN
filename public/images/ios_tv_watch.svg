<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle circles in background -->
  <circle cx="650" cy="150" r="100" fill="#E0E7FF" opacity="0.6" />
  <circle cx="150" cy="450" r="150" fill="#CFFAFE" opacity="0.6" />

  <!-- Apple TV Mockup -->
  <g transform="translate(150, 100)" filter="url(#shadow)">
    <rect width="500" height="280" rx="16" fill="#1E293B" />
    <rect x="10" y="10" width="480" height="260" rx="8" fill="#0F172A" />
    <!-- Screen content abstract -->
    <rect x="30" y="30" width="440" height="150" rx="4" fill="url(#cyanGrad)" opacity="0.8" />
    <circle cx="70" cy="210" r="20" fill="#334155" />
    <circle cx="130" cy="210" r="20" fill="#334155" />
    <circle cx="190" cy="210" r="20" fill="#334155" />
    <rect x="250" y="195" width="220" height="10" rx="5" fill="#334155" />
    <rect x="250" y="215" width="160" height="10" rx="5" fill="#334155" />
  </g>

  <!-- iPad Mockup -->
  <g transform="translate(480, 280)" filter="url(#shadow)">
    <rect width="200" height="280" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <rect x="8" y="8" width="184" height="264" rx="10" fill="#FFFFFF" />
    <rect x="20" y="20" width="160" height="120" rx="8" fill="url(#cyanGrad)" opacity="0.8" />
    <rect x="20" y="160" width="160" height="12" rx="6" fill="#E2E8F0" />
    <rect x="20" y="180" width="160" height="12" rx="6" fill="#E2E8F0" />
    <rect x="20" y="200" width="160" height="12" rx="6" fill="#E2E8F0" />
    <rect x="20" y="220" width="100" height="12" rx="6" fill="#E2E8F0" />
  </g>

  <!-- Apple Watch Mockup -->
  <g transform="translate(180, 320)" filter="url(#shadow)">
    <!-- Watch Band -->
    <path d="M40 0 L100 0 L90 200 L50 200 Z" fill="#334155" />
    <!-- Watch Face -->
    <rect x="20" y="30" width="100" height="120" rx="28" fill="#1E293B" stroke="#94A3B8" stroke-width="3" />
    <rect x="28" y="38" width="84" height="104" rx="20" fill="#000000" />
    <circle cx="70" cy="90" r="24" stroke="url(#cyanGrad)" stroke-width="6" fill="none" />
    <circle cx="70" cy="90" r="14" stroke="#10B981" stroke-width="4" fill="none" />
    <circle cx="70" cy="90" r="6" fill="#F43F5E" />
    <rect x="122" y="50" width="6" height="20" rx="3" fill="#64748B" />
  </g>
</svg>
